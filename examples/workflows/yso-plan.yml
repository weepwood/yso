name: YSO Plan

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    uses: weepwood/yso/.github/workflows/reusable-sync.yml@main
    with:
      command: plan
      engine-ref: main
      commit-changes: false
    secrets:
      YUQUE_TOKEN: ${{ secrets.YUQUE_TOKEN }}
      YUQUE_HOST: ${{ secrets.YUQUE_HOST }}
