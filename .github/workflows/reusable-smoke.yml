name: Reusable Workflow Smoke

on:
  push:
    paths:
      - ".github/workflows/reusable-sync.yml"
      - ".github/workflows/reusable-smoke.yml"
      - "action.yml"
  pull_request:
    paths:
      - ".github/workflows/reusable-sync.yml"
      - ".github/workflows/reusable-smoke.yml"
      - "action.yml"

permissions:
  contents: read

jobs:
  readonly-startup:
    uses: ./.github/workflows/reusable-sync.yml
    with:
      command: doctor
      engine-ref: ${{ github.sha }}
      commit-changes: false
      smoke-only: true
