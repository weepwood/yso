name: Obsidian → Yuque

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: yso-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    if: ${{ vars.YSO_ENABLED == 'true' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Push local changes to Yuque
        env:
          YUQUE_TOKEN: ${{ secrets.YUQUE_TOKEN }}
          YUQUE_HOST: ${{ secrets.YUQUE_HOST }}
        run: npm run push
      - name: Commit sync state
        run: |
          git config user.name "yso-sync[bot]"
          git config user.email "yso-sync@users.noreply.github.com"
          git add .yso "${{ vars.YSO_VAULT_DIR || 'vault' }}"
          git diff --cached --quiet || git commit -m "同步：更新语雀同步状态"
          git push
