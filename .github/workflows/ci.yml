name: CI

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.build.json"
      - "action.yml"
      - ".github/workflows/reusable-sync.yml"
      - ".github/workflows/ci.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prepare smoke-test Vault
        run: |
          mkdir -p vault
          cp yso.config.example.json yso.config.json
      - name: Run local composite action
        uses: ./
        env:
          YSO_DOCTOR_SKIP_REMOTE: "1"
        with:
          command: doctor
          yuque-token: smoke-test-token

  worker-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Build Worker without deploying
        working-directory: worker
        run: npx wrangler deploy --dry-run --outdir /tmp/yso-worker-dist
